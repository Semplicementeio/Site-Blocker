<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Blocker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-brand">
        <img src="icon.png" alt="Logo" class="logo">
        <h1>Site Blocker</h1>
      </div>
      <div class="header-actions">
        <a href="https://github.com/Semplicementeio/Site-Blocker" target="_blank" rel="noopener noreferrer" class="github-btn" title="GitHub Repository" aria-label="GitHub Repository">
          <svg class="github-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <a href="https://ko-fi.com/semplicementeio" target="_blank" rel="noopener noreferrer" class="kofi-btn" title="Support on Ko-fi">
          ☕ Support
        </a>
      </div>
    </div>

    <div class="card df-card">
      <div class="df-header">
        <div class="df-info">
          <span class="df-title">🎯 Distraction-Free Mode</span>
          <span class="df-desc">Instantly block all social media and distracting sites</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="df-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <span class="section-title">🚫 Block Short Videos</span>
      </div>
      <div class="checkbox-grid">
        <label class="checkbox-label" for="shorts-youtube">
          <input type="checkbox" id="shorts-youtube">
          <span class="custom-checkbox"></span>
          <span class="label-text">YouTube Shorts</span>
        </label>
        <label class="checkbox-label" for="shorts-instagram">
          <input type="checkbox" id="shorts-instagram">
          <span class="custom-checkbox"></span>
          <span class="label-text">Instagram Reels</span>
        </label>
        <label class="checkbox-label" for="shorts-tiktok">
          <input type="checkbox" id="shorts-tiktok">
          <span class="custom-checkbox"></span>
          <span class="label-text">TikTok</span>
        </label>
        <label class="checkbox-label" for="shorts-facebook">
          <input type="checkbox" id="shorts-facebook">
          <span class="custom-checkbox"></span>
          <span class="label-text">Facebook Reels</span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <span class="section-title">🌐 Your Blocked Sites</span>
        <span class="badge" id="sites-count">0</span>
      </div>
      <div class="main-controls">
        <button id="toggle-block-btn">Block current site</button>
        <div class="input-group">
          <input type="text" id="site-input" placeholder="e.g. example.com">
          <button id="add-btn">Add</button>
        </div>
      </div>
      <ul id="blocked-list"></ul>
    </div>
    
    <details class="card import-export">
      <summary class="import-export-summary">
        <span class="section-title">💾 Backup & Restore (JSON)</span>
        <span class="chevron">▾</span>
      </summary>
      <div class="import-export-content">
        <div class="import-export-buttons">
          <button id="export-btn" class="secondary-btn">Export List</button>
          <button id="import-btn" class="secondary-btn">Import List</button>
        </div>
        <textarea id="import-export-area" placeholder="Paste JSON list here to import..."></textarea>
      </div>
    </details>
  </div>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
