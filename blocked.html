<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Pause</title>
    <style>
        :root {
            --bg-color: #0c0d0e;
            --card-bg: #18191b;
            --primary: #b91c1c;
            --primary-glow: rgba(185, 28, 28, 0.3);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Breathing Circle */
        .breath-container {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0;
        }

        .breath-outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(185, 28, 28, 0.25);
            animation: rotateSlow 20s linear infinite;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .breath-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.85) 0%, rgba(127, 29, 29, 0.55) 60%, rgba(185, 28, 28, 0.05) 100%);
            box-shadow: 0 0 35px var(--primary-glow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: breathe 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(0.85);
                box-shadow: 0 0 20px rgba(185, 28, 28, 0.2);
            }
            33% {
                transform: scale(1.35);
                box-shadow: 0 0 50px rgba(185, 28, 28, 0.55);
            }
            66% {
                transform: scale(1.35);
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
            }
        }

        .breath-instruction {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .timer-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
            font-weight: 500;
        }

        .heading {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .subheading {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 440px;
        }

        .quote-box {
            margin-top: 4px;
            padding: 10px 18px;
            border-left: 2px solid rgba(185, 28, 28, 0.55);
            background: rgba(185, 28, 28, 0.07);
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #a1a1aa;
            font-style: italic;
            text-align: left;
            max-width: 400px;
        }

        /* Buttons & Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-top: 4px;
        }

        .btn-primary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 24px;
            background: rgba(185, 28, 28, 0.12);
            border: 1.5px solid rgba(185, 28, 28, 0.55);
            color: #fca5a5;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(185, 28, 28, 0.15);
            transition: all 0.2s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: rgba(185, 28, 28, 0.24);
            border-color: #b91c1c;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(185, 28, 28, 0.35);
        }

        .btn-secondary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            border-color: #3f3f46;
            transform: translateY(-1px);
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            transform: none !important;
        }

        .support-link {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .support-link:hover {
            color: #fca5a5;
            background: rgba(185, 28, 28, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Breathing Guidance Animation -->
        <div class="breath-container">
            <div class="breath-outer-ring"></div>
            <div class="breath-circle">
                <span class="breath-instruction" id="breath-text">Inhale</span>
                <span class="timer-text" id="countdown-text">10s</span>
            </div>
        </div>

        <h1 class="heading">Take a Mindful Pause</h1>
        <p class="subheading" id="subheading-text">You chose to block this content to protect your time and focus. Take a deep breath.</p>

        <!-- Quote Box placed ABOVE the buttons as requested -->
        <div class="quote-box">
            "True freedom is having full control over your attention."
        </div>

        <div class="actions">
            <button class="btn-primary" id="close-tab-btn">Close tab</button>
            <button class="btn-secondary" id="proceed-btn" disabled>Continue anyway (10s)</button>
        </div>

        <a href="https://ko-fi.com/semplicemente" target="_blank" rel="noopener noreferrer" class="support-link">
            ☕ Support on Ko-fi
        </a>
    </div>

    <script src="blocked.js"></script>
</body>
</html>
