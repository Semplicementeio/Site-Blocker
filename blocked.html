<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Pause</title>
    <style>
        :root {
            --bg-color: #0c0d0e;
            --card-bg: #18191b;
            --primary: #0ea5e9;
            --primary-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Breathing Circle */
        .breath-container {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0;
        }

        .breath-outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(56, 189, 248, 0.25);
            animation: rotateSlow 20s linear infinite;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .breath-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.85) 0%, rgba(14, 165, 233, 0.55) 60%, rgba(2, 132, 199, 0.08) 100%);
            box-shadow: 0 0 35px var(--primary-glow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: breathe 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(0.85);
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            }
            33% {
                transform: scale(1.35);
                box-shadow: 0 0 50px rgba(56, 189, 248, 0.55);
            }
            66% {
                transform: scale(1.35);
                box-shadow: 0 0 40px rgba(125, 211, 252, 0.4);
            }
        }

        .breath-instruction {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .timer-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 2px;
            font-weight: 500;
        }

        .heading {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .subheading {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 440px;
        }

        .quote-box {
            margin-top: 4px;
            padding: 10px 18px;
            border-left: 2px solid rgba(56, 189, 248, 0.55);
            background: rgba(56, 189, 248, 0.07);
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #a1a1aa;
            font-style: italic;
            text-align: left;
            max-width: 400px;
        }

        /* Buttons & Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-top: 4px;
        }

        .btn-primary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 24px;
            background: rgba(14, 165, 233, 0.12);
            border: 1.5px solid rgba(56, 189, 248, 0.5);
            color: #7dd3fc;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 14px rgba(14, 165, 233, 0.15);
            transition: all 0.2s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: rgba(14, 165, 233, 0.24);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }

        .btn-secondary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            border-color: #3f3f46;
            transform: translateY(-1px);
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            transform: none !important;
        }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .support-link {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .support-link:hover {
            color: #7dd3fc;
            background: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breath-container">
            <div class="breath-outer-ring"></div>
            <div class="breath-circle">
                <span class="breath-instruction" id="breath-text">Inhale</span>
                <span class="timer-text" id="countdown-text">10s</span>
            </div>
        </div>

        <h1 class="heading">Take a Mindful Pause</h1>
        <p class="subheading" id="subheading-text">You chose to block this content to protect your time and focus. Take a deep breath.</p>

        <div class="quote-box">
            "True freedom is having full control over your attention."
        </div>

        <div class="actions">
            <button class="btn-primary" id="close-tab-btn">Close tab</button>
            <button class="btn-secondary" id="proceed-btn" disabled>Continue anyway (10s)</button>
        </div>

        <div class="footer-links">
            <a href="https://github.com/Semplicementeio/Site-Blocker" target="_blank" rel="noopener noreferrer" class="support-link" title="GitHub Repository">

                GitHub
            </a>
            <a href="https://ko-fi.com/semplicementeio" target="_blank" rel="noopener noreferrer" class="support-link">
                ☕ Support on Ko-fi
            </a>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="blocked.js"></script>
</body>
</html>
